        // LOAD STATE FROM LOCALSTORAGE
        function loadState() {
            try {
                const saved = localStorage.getItem('deutschfun_pro_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) {
                console.error("Could not load local storage", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('deutschfun_pro_state', JSON.stringify(state));
            } catch (e) {
                console.error("Could not save to local storage", e);
            }
            updateHeaderStats();

        // SPEECH SYNTHESIS ENGINE
        function speakGerman(text) {
            if (!('speechSynthesis' in window)) {
                showToast('عذرًا، ميزة النطق الصوتي غير مدعومة في متصفحك.', 'warning');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = 0.88;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
            showToast(`🔊 جاري النطق: "${text}"`, 'info');
        }

        // TOAST ENGINE
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-800 text-white border-slate-700';
            if (type === 'success') bg = 'bg-emerald-600 text-white border-emerald-500';
            if (type === 'warning') bg = 'bg-amber-600 text-white border-amber-500';
            if (type === 'error') bg = 'bg-red-600 text-white border-red-500';

            toast.className = `p-3.5 rounded-2xl shadow-2xl border text-xs md:text-sm font-medium flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto ${bg}`;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <span>${type === 'success' ? '🎉' : type === 'warning' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️'}</span>
                    <span>${msg}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ------------------ MAIN RENDER CONTROLLER ------------------
        function renderApp() {
            renderDesktopNav();
            renderMobileNav();
            updateHeaderStats();

            const container = document.getElementById('view-container');
            container.innerHTML = '';

            switch (state.currentView) {
                case 'dashboard':
                    container.appendChild(buildDashboardView());
                    break;
                case 'lessons':
                    container.appendChild(buildLessonsView());
                    break;
                case 'grammar':
                    container.appendChild(buildGrammarView());
                    break;
                case 'dictionary':
                    container.appendChild(buildDictionaryView());
                    break;
                case 'games':
                    container.appendChild(buildGamesView());
                    break;
                case 'quiz':
                    container.appendChild(buildQuizView());
                    break;
                case 'stats':
                    container.appendChild(buildStatsView());
                    break;
                case 'settings':
                    container.appendChild(buildSettingsView());
                    break;
                default:
                    container.appendChild(buildDashboardView());
            }
        }

        function navigateTo(viewId) {
            state.currentView = viewId;
            saveState();
            renderApp();
            // Scroll to top of view container
            document.getElementById('view-container').scrollTop = 0;
        }

        function filterByLevel(lvl) {
            state.activeLevelFilter = lvl;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active', 'bg-red-600', 'text-white'));
            const targetBtn = document.getElementById(`lvl-btn-${lvl}`);
            if (targetBtn) targetBtn.classList.add('active', 'bg-red-600', 'text-white');
            renderApp();
        }

        function updateHeaderStats() {
            document.getElementById('sidebar-xp').innerText = state.xp;
            document.getElementById('sidebar-streak').innerText = `${state.streak} يوم`;
            document.getElementById('mobile-xp').innerText = state.xp;
            document.getElementById('mobile-streak').innerText = `${state.streak} أ`;
        }

        function renderDesktopNav() {
            const nav = document.getElementById('desktop-nav');
            nav.innerHTML = NAV_ITEMS.map(item => {
                const isActive = state.currentView === item.id;
                return `
                    <button onclick="navigateTo('${item.id}')" class="w-full flex items-center justify-between px-4 py-3 rounded-2xl font-bold text-sm transition-all duration-200 ${isActive ? 'bg-gradient-to-r from-red-600 to-amber-600 text-white shadow-lg shadow-red-500/20' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
                        <div class="flex items-center gap-3">
                            <i class="fas ${item.icon} text-base ${isActive ? 'text-white' : 'text-slate-400 dark:text-slate-500'}"></i>

                        </div>
                        ${isActive ? '<i class="fas fa-chevron-left text-xs"></i>' : ''}
                    </button>

        function closePlacementTestModal() {

        function checkMiniExercise(btn, isCorrect, explain) {
            const container = btn.closest('.space-y-3');
            const feedback = container.querySelector('.ex-feedback');
            
            container.querySelectorAll('button').forEach(b => b.classList.remove('bg-emerald-500', 'bg-red-500', 'text-white'));

            feedback.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-600', 'bg-red-500/10', 'text-red-600');

            if (isCorrect) {
                btn.classList.add('bg-emerald-600', 'text-white');
                feedback.classList.add('bg-emerald-500/10', 'text-emerald-600', 'border', 'border-emerald-500/20');
                feedback.innerHTML = `✅ إجابة صحيحة! ${explain}`;
                addXP(10);
            } else {
                btn.classList.add('bg-red-600', 'text-white');
                feedback.classList.add('bg-red-500/10', 'text-red-600', 'border', 'border-red-500/20');
                feedback.innerHTML = `❌ إجابة خاطئة! ${explain}`;
            }
        }

        function markLessonComplete(lessonId) {
            if (!state.completedLessons.includes(lessonId)) {
                state.completedLessons.push(lessonId);
                addXP(50);
                showToast('🎉 تهانينا! أكملت الدرس وحصلت على 50+ XP', 'success');
            } else {
                showToast('الدرس علامة مكتمل بالفعل', 'info');
            }
            saveState();
            closePlacementTestModal();
            renderApp();
        }

        function addXP(amount) {
            state.xp += amount;
            saveState();
        }

        function renderDictionaryGrid(filterMode = 'ALL') {
            const grid = document.getElementById('dictionary-grid');

            if (filterMode === 'FAV') words = words.filter(w => state.favoriteWords.includes(w.de));
            if (filterMode === 'LEARNED') words = words.filter(w => state.learnedWords.includes(w.de));
            if (state.activeLevelFilter !== 'ALL') words = words.filter(w => w.level === state.activeLevelFilter);

            if (words.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm font-medium">لا توجد كلمات مطابقة للبحث أو التصفية الحالية.</div>`;

                const isLearned = state.learnedWords.includes(word.de);

                                </button>
                                <button onclick="toggleLearnedWord('${word.de.replace(/'/g, "\\'")}')" class="p-1 text-slate-400 hover:text-emerald-500 transition">
                                    <i class="${isLearned ? 'fas fa-check-circle text-emerald-500' : 'far fa-check-circle'} text-sm"></i>

        function toggleFavoriteWord(wordDe) {
            if (state.favoriteWords.includes(wordDe)) {

        function toggleLearnedWord(wordDe) {

                state.learnedWords.push(wordDe);

        // GAME 1: WORD MATCH ENGINE
        function startWordMatchGame() {
            const area = document.getElementById('game-active-area');
            area.classList.remove('hidden');

            const sampleWords = [...DICTIONARY].sort(() => 0.5 - Math.random()).slice(0, 5);
            const germanWords = [...sampleWords].sort(() => 0.5 - Math.random());
            const arabicWords = [...sampleWords].sort(() => 0.5 - Math.random());

            let selectedDe = null;
            let selectedAr = null;
            let matches = 0;

            area.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
                    <h3 class="font-extrabold text-base flex items-center gap-2 text-amber-500">
                        <span>🧩 مطابقة الكلمات الألمانية والعربية</span>
                    </h3>
                    <button onclick="document.getElementById('game-active-area').classList.add('hidden')" class="text-xs text-slate-400 hover:text-red-500 font-bold">إغلاق اللعبة ✖</button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2" id="de-column">
                        <h4 class="text-xs font-bold text-slate-400">الكلمات بالألمانية 🇩🇪</h4>
                        ${germanWords.map(w => `
                            <button onclick="selectMatchWord(this, 'de', '${w.de.replace(/'/g, "\\'")}')" class="match-btn-de w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-xs md:text-sm hover:border-amber-500 transition text-right">
                                ${w.de}
                            </button>
                        `).join('')}
                    </div>

                    <div class="space-y-2" id="ar-column">
                        <h4 class="text-xs font-bold text-slate-400">الترجمة بالعربية 🇸🇦</h4>
                        ${arabicWords.map(w => `
                            <button onclick="selectMatchWord(this, 'ar', '${w.de.replace(/'/g, "\\'")}')" class="match-btn-ar w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-xs md:text-sm hover:border-amber-500 transition text-right">
                                ${w.ar}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            window.selectMatchWord = function(btn, lang, wordDeKey) {
                if (lang === 'de') {
                    document.querySelectorAll('.match-btn-de').forEach(b => b.classList.remove('bg-amber-500/20', 'border-amber-500'));
                    btn.classList.add('bg-amber-500/20', 'border-amber-500');
                    selectedDe = { btn, key: wordDeKey };
                } else {
                    document.querySelectorAll('.match-btn-ar').forEach(b => b.classList.remove('bg-amber-500/20', 'border-amber-500'));
                    btn.classList.add('bg-amber-500/20', 'border-amber-500');
                    selectedAr = { btn, key: wordDeKey };
                }

                if (selectedDe && selectedAr) {
                    if (selectedDe.key === selectedAr.key) {
                        selectedDe.btn.classList.add('bg-emerald-600', 'text-white', 'pointer-events-none');
                        selectedAr.btn.classList.add('bg-emerald-600', 'text-white', 'pointer-events-none');
                        matches++;
                        addXP(15);
                        showToast('تطابق صحيح! (+15 XP) 🎉', 'success');

                        if (matches === sampleWords.length) {
                            setTimeout(() => {
                                showToast('🏆 أحسنت! أكملت لعبة مطابقة الكلمات بنجاح!', 'success');
                                startWordMatchGame();
                            }, 500);
                        }
                    } else {
                        showToast('❌ تطابق غير صحيح، حاول مجدداً', 'error');
                    }
                    selectedDe = null;
                    selectedAr = null;
                }
            };
        }

        // GAME 2: SENTENCE BUILDER ENGINE
        function startSentenceBuilderGame() {
            const area = document.getElementById('game-active-area');
            area.classList.remove('hidden');

            const sentences = [
                { full: 'Ich lerne heute Deutsch in der Schule', ar: 'أنا أتعلم الألمانية اليوم في المدرسة' },
                { full: 'Das Buch liegt auf dem Tisch', ar: 'الكتاب يقع على الطاولة' },
                { full: 'Wir fahren am Wochenende nach Berlin', ar: 'نحن نسافر في نهاية الأسبوع إلى برلين' }
            ];

            const current = sentences[Math.floor(Math.random() * sentences.length)];
            const shuffled = current.full.split(' ').sort(() => 0.5 - Math.random());
            let userSequence = [];

            area.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
                    <h3 class="font-extrabold text-base flex items-center gap-2 text-blue-500">
                        <span>🔤 لعبة ترتيب الجملة الألمانية</span>
                    </h3>
                    <button onclick="document.getElementById('game-active-area').classList.add('hidden')" class="text-xs text-slate-400 hover:text-red-500 font-bold">إغلاق اللعبة ✖</button>
                </div>

                    <div class="p-3 bg-blue-500/10 border border-blue-500/20 text-blue-600 dark:text-blue-400 rounded-xl text-xs font-bold">

                        <span class="text-xs text-slate-400 font-medium">اضغط على الكلمات بالأسفل لترتيب الجملة...</span>
                    </div>

                    <!-- Shuffled Word Buttons -->
                    <div class="flex flex-wrap gap-2 pt-2" id="words-pool">
                        ${shuffled.map((w, idx) => `
                            <button onclick="pickSentenceWord(this, '${w}')" class="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-xs hover:bg-blue-600 hover:text-white transition shadow-sm">
                                ${w}
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="checkSentenceBuilder('${current.full}')" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl text-xs transition shadow-md">
                            تحقق من الجملة ✓
                        </button>
                        <button onclick="startSentenceBuilderGame()" class="px-4 py-2.5 bg-slate-200 dark:bg-slate-700 text-xs font-bold rounded-xl hover:bg-slate-300 transition">
                            جملة جديدة 🔄
                        </button>
                    </div>
                </div>
            `;

            window.pickSentenceWord = function(btn, word) {
                userSequence.push(word);
                btn.classList.add('opacity-30', 'pointer-events-none');
                
                const box = document.getElementById('built-sentence-box');
                if (userSequence.length === 1) box.innerHTML = '';
                
                const wTag = document.createElement('span');
                wTag.className = 'px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs shadow-sm';
                wTag.innerText = word;
                box.appendChild(wTag);
            };

            window.checkSentenceBuilder = function(targetSentence) {
                const builtStr = userSequence.join(' ');
                if (builtStr === targetSentence) {
                    showToast('🎉 ممتازة! الجملة مرّتبة بشكل صحيح تماماً (+25 XP)', 'success');
                    addXP(25);
                    setTimeout(startSentenceBuilderGame, 1000);
                } else {
                    showToast('❌ ترتيب غير صحيح للجملة، حاول مجدداً!', 'error');
                }
            };
        }

        // GAME 3: MEMORY CARDS ENGINE
        function startMemoryGame() {
            const area = document.getElementById('game-active-area');
            area.classList.remove('hidden');

            const pairs = [
                { id: 1, text: 'der Hund', type: 'de' },
                { id: 1, text: 'الكلب', type: 'ar' },
                { id: 2, text: 'das Haus', type: 'de' },
                { id: 2, text: 'المنزل', type: 'ar' },
                { id: 3, text: 'die Sonne', type: 'de' },
                { id: 3, text: 'الشمس', type: 'ar' }
            ].sort(() => 0.5 - Math.random());

            let flippedCards = [];
            let matchedPairs = 0;

            area.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
                    <h3 class="font-extrabold text-base flex items-center gap-2 text-emerald-500">
                        <span>🧠 لعبة الذاكرة (Memory Game)</span>
                    </h3>
                    <button onclick="document.getElementById('game-active-area').classList.add('hidden')" class="text-xs text-slate-400 hover:text-red-500 font-bold">إغلاق اللعبة ✖</button>
                </div>

                <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                    ${pairs.map((card, idx) => `
                        <div onclick="flipMemoryCard(this, ${card.id})" data-id="${card.id}" class="mem-card h-24 rounded-2xl bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 flex items-center justify-center font-bold text-xs cursor-pointer hover:border-emerald-500 transition shadow-sm text-center p-2 select-none">
                            <span class="card-back text-2xl">❓</span>
                            <span class="card-front hidden text-slate-900 dark:text-white font-extrabold">${card.text}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            window.flipMemoryCard = function(cardEl, cardId) {
                if (flippedCards.length === 2 || cardEl.classList.contains('matched') || cardEl.classList.contains('flipped')) return;

                cardEl.querySelector('.card-back').classList.add('hidden');
                cardEl.querySelector('.card-front').classList.remove('hidden');
                cardEl.classList.add('flipped', 'bg-emerald-500/20', 'border-emerald-500');

                flippedCards.push({ cardEl, id: cardId });

                if (flippedCards.length === 2) {
                    if (flippedCards[0].id === flippedCards[1].id) {
                        flippedCards.forEach(c => {
                            c.cardEl.classList.add('matched', 'bg-emerald-600', 'text-white');
                        });
                        matchedPairs++;
                        addXP(20);
                        showToast('زوج متطابق! (+20 XP)', 'success');
                        flippedCards = [];

                        if (matchedPairs === pairs.length / 2) {
                            setTimeout(() => {
                                showToast('🏆 رائع! أنهيت لعبة الذاكرة بنجاح!', 'success');
                                startMemoryGame();
                            }, 500);
                        }
                    } else {
                        setTimeout(() => {
                            flippedCards.forEach(c => {

<!-- Pronunciation Practice Engine (native Android speech recognition) -->
<script>
(function(){
  window.__sttTarget = '';

  window.practicePronunciation = function(text) {
    if (typeof AndroidSTT === 'undefined' || !AndroidSTT.startListening) {
      if (typeof showToast === 'function') showToast('🎤 التدريب الصوتي غير متاح في هذا الإصدار من التطبيق', 'error');
      return;
    }
    window.__sttTarget = text;
    if (typeof showToast === 'function') showToast('🎤 تحدث الآن بالألمانية...', 'info');
    AndroidSTT.startListening();
  };

  function normalize(s) {
    return (s || '').toLowerCase()
      .replace(/[.,!?;:()"'،؟]/g, '')
      .replace(/ß/g, 'ss')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function similarity(a, b) {
    a = normalize(a); b = normalize(b);
    if (!a || !b) return 0;
    if (a === b) return 1;
    var la = a.length, lb = b.length;
    var dp = [];
    for (var i = 0; i <= la; i++) dp.push([i]);
    for (var j = 0; j <= lb; j++) dp[0][j] = j;
    for (i = 1; i <= la; i++) {
      for (j = 1; j <= lb; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    var dist = dp[la][lb];
    return 1 - (dist / Math.max(la, lb));
  }

  window.onSpeechResult = function(recognized) {
    var target = window.__sttTarget;
    var score = similarity(recognized, target);
    if (score >= 0.72) {
      if (typeof showToast === 'function') showToast('✅ نطق ممتاز! سمعت: "' + recognized + '"', 'success');
    } else {
      if (typeof showToast === 'function') showToast('❌ حاول مرة أخرى. سمعت: "' + recognized + '" بدل "' + target + '"', 'error');
    }
  };

  window.onSpeechError = function(code) {
    if (typeof showToast === 'function') showToast('⚠️ لم أسمع بوضوح، حاول التحدث مرة أخرى بصوت أعلى', 'error');
  };
})();

function playTone(freq, duration, type='sine') {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) { console.error('Audio error', e); }
}
function playCorrectSound() {
    playTone(523.25, 0.15);
    setTimeout(() => playTone(783.99, 0.2), 100);
}
function playWrongSound() {
    playTone(200, 0.3, 'sawtooth');
}
function vibrateDevice(pattern = 50) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

function checkMiniExercise(btn, isCorrect, explain) {

        addXP(10);

        feedback.innerHTML = `❌ إجابة خاطئة! ${explain}`;

}

const LEVEL_ORDER = ['A1', 'A2', 'B1'];

function isLevelUnlocked(level) {
    ensureNewStateDefaults();
    return state.unlockedLevels.includes(level);
}

function previousLevelOf(level) {
    const idx = LEVEL_ORDER.indexOf(level);
    return idx > 0 ? LEVEL_ORDER[idx - 1] : null;
}

function unlockNextLevel(currentLevel) {
    const idx = LEVEL_ORDER.indexOf(currentLevel);
    const next = LEVEL_ORDER[idx + 1];
    if (next && !state.unlockedLevels.includes(next)) {
        state.unlockedLevels.push(next);
        saveState();
        showAchievementPopup({ icon: '🔓', title: 'مستوى جديد مفتوح!', desc: 'أصبح بإمكانك الآن دراسة مستوى ' + next });
    }
}

// ---------- 3) إعادة تعريف امتحان المستوى ليصبح امتحان فتح حقيقي ----------
function startLevelQuiz(lvl) {
    const prevLevel = previousLevelOf(lvl);
    if (prevLevel && !isLevelUnlocked(lvl)) {
        showToast('🔒 يجب اجتياز امتحان مستوى ' + prevLevel + ' أولاً بنسبة 70% على الأقل', 'warning');
        return;
    }

    const area = document.getElementById('quiz-active-area');
    area.classList.remove('hidden');

    const questions = (LEVEL_EXAMS[lvl] || []).slice();
    let qIdx = 0;
    let score = 0;

    function renderQ() {
        const q = questions[qIdx];
        area.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
                <span class="text-xs font-bold text-slate-400">سؤال ${qIdx + 1} من ${questions.length}</span>
                <span class="text-xs font-bold text-red-600">امتحان فتح مستوى ${lvl}</span>
            </div>
            <div class="space-y-4">
                <h3 class="font-extrabold text-base md:text-lg">${q.q}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${q.options.map((opt, idx) => `
                        <button onclick="answerQuizQ(${idx === q.correct}, '${q.explain.replace(/'/g, "\\'")}')" class="p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 font-bold text-xs md:text-sm hover:border-red-600 transition text-right">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    window.answerQuizQ = function(isCorrect, explain) {
        if (isCorrect) {
            score++;
            addXP(15);
            showToast('إجابة صحيحة! (+15 XP)', 'success');
        } else {
            showToast(`إجابة خاطئة! ${explain}`, 'error');
        }

        qIdx++;
        if (qIdx < questions.length) {
            renderQ();
        } else {
            const percentage = Math.round((score / questions.length) * 100);
            const passed = percentage >= 70;

            if (passed) unlockNextLevel(lvl);

            area.innerHTML = `
                <div class="text-center py-8 space-y-4">
                    <div class="text-5xl">${passed ? '🏆' : '📖'}</div>
                    <h3 class="font-black text-2xl">${passed ? 'مبروك! اجتزت الامتحان بنجاح' : 'قريب جدًا! حاول مرة أخرى'}</h3>
                    <p class="text-sm font-bold text-slate-600 dark:text-slate-300">حصلت على نتيجة ${score} من ${questions.length} (${percentage}%)</p>
                    ${passed ? `<p class="text-xs text-emerald-600 font-bold">🔓 تم فتح المستوى التالي!</p>` : `<p class="text-xs text-amber-600 font-bold">تحتاج 70% على الأقل لفتح المستوى التالي — راجع الدروس وحاول مجددًا</p>`}
                    <button onclick="document.getElementById('quiz-active-area').classList.add('hidden')" class="px-6 py-2.5 bg-red-600 text-white font-bold rounded-xl text-xs hover:bg-red-700 transition">إغلاق الاختبار</button>
                </div>
            `;
        }
    };

    renderQ();
}

(function guardOpenLessonModal(){
    const originalOpenLessonModal = window.openLessonModal;
    window.openLessonModal = function(lessonId) {
        const lesson = LESSONS.find(l => l.id === lessonId);
        if (lesson && !isLevelUnlocked(lesson.level)) {
            showToast('🔒 أكمل امتحان مستوى ' + previousLevelOf(lesson.level) + ' أولاً لفتح هذا الدرس', 'warning');
            return;
        }
        originalOpenLessonModal(lessonId);
    };
})();

// ---------- 6) نظام Streak حقيقي ----------
function updateRealStreak() {
    const todayStr = new Date().toISOString().slice(0, 10);
    const lastVisit = state.lastVisitDate;
    if (!lastVisit) {
        state.streak = 1;
    } else if (lastVisit !== todayStr) {
        const diffDays = Math.round((new Date(todayStr) - new Date(lastVisit)) / 86400000);
        if (diffDays === 1) state.streak = (state.streak || 0) + 1;
        else if (diffDays > 1) state.streak = 1;
    }
    state.lastVisitDate = todayStr;
    saveState();
    updateHeaderStats();
}

            state.achievements.push(ach.id);
            showAchievementPopup(ach);
        }
    });
    saveState();
}

function showAchievementPopup(ach) {
    const popup = document.getElementById('achievement-popup');
    if (!popup) return;
    popup.innerHTML = `
        <div class="flex items-center gap-3 px-5 py-3.5 bg-gradient-to-r from-amber-500 to-red-500 text-white rounded-2xl shadow-2xl border border-white/30">
            <span class="text-3xl">${ach.icon}</span>
            <div>
                <div class="text-xs font-bold opacity-90">🏆 إنجاز جديد!</div>
                <div class="font-black text-sm">${ach.title}</div>
                <div class="text-[11px] opacity-80">${ach.desc}</div>
            </div>
        </div>`;
    popup.classList.remove('hidden');
    if (typeof vibrateDevice === 'function') vibrateDevice([40, 30, 40]);
    if (typeof playTone === 'function') {
        playTone(880, 0.12);
        setTimeout(() => playTone(1174.66, 0.18), 130);
    }
    setTimeout(() => { popup.classList.add('hidden'); }, 4000);
}

(function hookAchievementChecks(){
    const originalAddXP = window.addXP;
    window.addXP = function(amount) {
        originalAddXP(amount);
        checkAchievements();
    };
    const originalToggleLearned = window.toggleLearnedWord;
    if (originalToggleLearned) {
        window.toggleLearnedWord = function(wordDe) {
            originalToggleLearned(wordDe);
            checkAchievements();
        };
    }
})();

// ---------- 8) كلمة اليوم ----------
function getWordOfDay() {
    const dayIndex = Math.floor(Date.now() / 86400000);
    return DICTIONARY[dayIndex % DICTIONARY.length];
}

function injectWordOfDayCard() {
    const container = document.getElementById('view-container');
    if (!container) return;
    if (container.querySelector('#word-of-day-card')) return;
    const word = getWordOfDay();
    const card = document.createElement('div');
    card.id = 'word-of-day-card';
    card.className = 'max-w-6xl mx-auto p-5 rounded-3xl bg-gradient-to-l from-indigo-600 to-blue-600 text-white shadow-lg flex items-center justify-between gap-4 mb-6';
    card.innerHTML = `
        <div>
            <div class="text-xs font-bold text-white/80 mb-1">📅 كلمة اليوم</div>
            <div class="text-2xl font-black">${word.de}</div>
            <div class="text-sm text-white/90 font-bold">${word.ar}</div>
        </div>
        <button onclick="speakGerman('${word.de.replace(/'/g, "\\'")}')" class="w-12 h-12 rounded-full bg-white/20 hover:bg-white/30 transition flex items-center justify-center shrink-0">
            <i class="fas fa-volume-high"></i>
        </button>`;
    container.insertBefore(card, container.firstChild);
}

(function hookRenderAppForWordOfDay(){
    const originalRenderApp = window.renderApp;
    window.renderApp = function() {
        originalRenderApp();
        if (state.currentView === 'dashboard') injectWordOfDayCard();
    };
})();

// ---------- 9) تشغيل كل التحديثات عند فتح التطبيق ----------
window.addEventListener('load', function() {
    ensureNewStateDefaults();
    updateRealStreak();
    checkAchievements();
    renderApp();
});

</script>
